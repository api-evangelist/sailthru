envelope:
  fields: [error, errormsg]
  description: >-
    On failure the response body carries a numeric `error` field and a human
    (technical) `errormsg` string, in whichever serialization the `format`
    parameter requested. The docs explicitly warn that errormsg is technical
    and should not be surfaced to end users. There is no `type` URI, no
    `title`/`detail` split and no application/problem+json media type, so this
    is a pre-RFC-9457 error registry rather than Problem Details.
  observed_example: >-
    GET https://api.sailthru.com/send with no credentials returns HTTP 400 and
    <?xml version="1.0" encoding="utf-8"?><triggermail><error>2</error>
    <errormsg>Missing required parameter: api_key</errormsg></triggermail>
  observed: '2026-08-12'
