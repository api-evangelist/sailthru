aid: sailthru
name: Sailthru
description: 'Sailthru is a cross-channel relationship-marketing and personalization
  platform built for media, publishing, retail and e-commerce brands, unifying email,
  SMS, mobile push, in-app and on-site messaging around a single customer profile
  with predictive segmentation and 1:1 content personalization. Founded in New York
  in 2008, it was acquired by CM Group (later Marigold) in 2018 and became part of
  Zeta Global in November 2025 when Zeta bought Marigold''s enterprise software business;
  the product is now documented as Sailthru by Zeta. Its public HTTPS API lives at
  api.sailthru.com and covers users, lists, content, templates, blasts (campaigns),
  transactional sends, triggers, purchases, events, includes, ad plans and stats,
  authenticated with an api_key plus an MD5 signature computed over the request parameters.
  It is complemented by the Zephyr template language, a JavaScript on-site personalization
  tag, mobile SDKs, and API postbacks (webhooks) for opt-out, hardbounce, verify and
  profile-update events.'
