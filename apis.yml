apis:
- aid: sailthru:sailthru-api
  name: Sailthru API
  description: 'The core Sailthru HTTPS API. All requests are GET, POST or DELETE
    calls to https://api.sailthru.com/<endpointName>, authenticated with api_key,
    an MD5 sig over the sorted parameter values, and a format parameter (json or xml).
    Endpoints cover user profiles, lists, content, templates, blasts (campaigns),
    transactional send, trigger, purchase, event, include, ad-plan, preview, settings,
    stats and bulk job operations.'
